name: Upload Website

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - run: npm ci

      - run: npm run build
        env:
          CI: false

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - run: |
          aws s3 sync build/ s3://${{ secrets.AWS_S3_BUCKET }}/ --delete --cache-control "public, max-age=0, must-revalidate" --exclude "static/*"
          aws s3 sync build/static/ s3://${{ secrets.AWS_S3_BUCKET }}/static/ --delete --cache-control "public, max-age=31536000, immutable"

      - run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"